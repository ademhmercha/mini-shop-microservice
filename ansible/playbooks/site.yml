---
- name: Configuration de base et durcissement du cluster
  hosts: k8s_cluster
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]

- name: Installation de Kubernetes
  ansible.builtin.import_playbook: k8s.yml

- name: Plateforme du cluster
  ansible.builtin.import_playbook: platform.yml

- name: Application ShopLite
  ansible.builtin.import_playbook: app.yml
