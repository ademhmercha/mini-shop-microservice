[defaults]
# Inventaire dynamique Azure (chemin relatif à ce fichier).
inventory = inventory/azure_rm.yml
roles_path = roles
remote_user = azureuser
private_key_file = ~/.ssh/shoplite
# Mot de passe du coffre : stocké HORS du dépôt (permissions 600).
vault_password_file = ~/.ansible/shoplite-vault-pass
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True

# Sortie lisible : format YAML au lieu du JSON compact.
stdout_callback = default
result_format = yaml

# Vérification des clés d'hôte désactivée (voir README, section Sécurité) :
# les machines sont détruites et recréées à chaque séance, donc leurs clés
# d'hôte et parfois leurs IP changent. Un known_hosts persistant produirait
# des erreurs "REMOTE HOST IDENTIFICATION HAS CHANGED" à chaque fois.
# Impact : la première connexion à une machine n'est pas authentifiée (risque
# d'attaque de l'homme du milieu). Il est limité car l'authentification se
# fait par clé SSH (aucun mot de passe ne transite) et que les IP sont
# fraîchement lues depuis l'API Azure.
host_key_checking = False

[inventory]
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.yaml, ansible.builtin.ini

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# UserKnownHostsFile=/dev/null : ne pas polluer ~/.ssh/known_hosts avec des
# clés de machines éphémères (cohérent avec host_key_checking = False).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null
