---
- name: Télécharger les CRD Gateway API (version standard épinglée)
  ansible.builtin.uri:
    url: "{{ gateway_crds_url }}"
    return_content: true
  register: gateway_crds_download
  until: gateway_crds_download.status == 200
  retries: 6
  delay: 10
  changed_when: false  # lecture seule

- name: Lire les CRD Gateway API
  ansible.builtin.set_fact:
    gateway_crd_documents: "{{ gateway_crds_download.content | from_yaml_all | select | list }}"

# Application côté serveur : les CRD Gateway API dépassent la taille maximale
# de l'annotation utilisée par l'apply classique.
- name: Installer les CRD Gateway API
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ item }}"
  loop: "{{ gateway_crd_documents }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Ajouter le dépôt Helm de Traefik
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: "{{ gateway_traefik_repo_url }}"

- name: Installer Traefik (contrôleur Gateway API)
  kubernetes.core.helm:
    name: "{{ gateway_traefik_release }}"
    chart_ref: traefik/traefik
    chart_version: "{{ platform_traefik_chart_version }}"
    release_namespace: "{{ platform_gateway_namespace }}"
    create_namespace: true
    values: "{{ gateway_traefik_values }}"
    state: present
    wait: true
    wait_timeout: 5m

- name: Déclarer la GatewayClass Traefik
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: "{{ gateway_class_name }}"
      spec:
        controllerName: traefik.io/gateway-controller

# Ports des écouteurs = ports internes de Traefik (8000 / 8443), exposés en
# 80 / 443 sur la machine par hostPort. L'annotation demande à cert-manager
# le certificat de l'écouteur HTTPS.
- name: Créer la Gateway partagée (HTTP et HTTPS)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: "{{ platform_gateway_name }}"
        namespace: "{{ platform_gateway_namespace }}"
        annotations:
          cert-manager.io/cluster-issuer: "{{ platform_cert_issuer }}"
      spec:
        gatewayClassName: "{{ gateway_class_name }}"
        listeners:
          - name: http
            port: 8000
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            port: 8443
            protocol: HTTPS
            hostname: "{{ platform_domain }}"
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  name: "{{ platform_gateway_tls_secret }}"
            allowedRoutes:
              namespaces:
                from: All

# Redirection automatique HTTP vers HTTPS. Les routes plus spécifiques
# (défi ACME /.well-known/acme-challenge/...) restent prioritaires.
- name: Rediriger HTTP vers HTTPS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: redirect-http-to-https
        namespace: "{{ platform_gateway_namespace }}"
      spec:
        parentRefs:
          - name: "{{ platform_gateway_name }}"
            sectionName: http
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
