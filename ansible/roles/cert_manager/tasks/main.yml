---
- name: Ajouter le dépôt Helm de cert-manager
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "{{ cert_manager_repo_url }}"

- name: Installer cert-manager
  kubernetes.core.helm:
    name: "{{ cert_manager_release }}"
    chart_ref: jetstack/cert-manager
    chart_version: "{{ platform_cert_manager_chart_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    values: "{{ cert_manager_values }}"
    state: present
    wait: true
    wait_timeout: 5m

# L'e-mail (valeur du coffre) est masqué dans les journaux.
- name: Créer les émetteurs Let's Encrypt (défi HTTP-01 via la Gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ item.name }}"
      spec:
        acme:
          server: "{{ item.server }}"
          email: "{{ platform_letsencrypt_email }}"
          privateKeySecretRef:
            name: "{{ item.name }}-account-key"
          solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                    - kind: Gateway
                      name: "{{ platform_gateway_name }}"
                      namespace: "{{ platform_gateway_namespace }}"
                      sectionName: http
  loop: "{{ cert_manager_acme_issuers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# Repli : certificat auto-signé si Let's Encrypt refuse le domaine sslip.io
# (limites de fréquence). Sélection : platform_cert_issuer: selfsigned.
- name: Créer l'émetteur auto-signé de repli
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: selfsigned
      spec:
        selfSigned: {}

- name: Attendre que le certificat de la Gateway soit émis
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ platform_gateway_tls_secret }}"
    namespace: "{{ platform_gateway_namespace }}"
  register: cert_manager_certificate
  until: >-
    cert_manager_certificate.resources | length > 0 and
    (cert_manager_certificate.resources[0].status.conditions | default([])
     | selectattr('type', 'eq', 'Ready') | selectattr('status', 'eq', 'True') | list | length > 0)
  retries: 40
  delay: 10
  when: cert_manager_wait_certificate | bool
