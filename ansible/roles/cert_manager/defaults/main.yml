---
cert_manager_namespace: cert-manager
cert_manager_release: cert-manager
cert_manager_repo_url: https://charts.jetstack.io
cert_manager_wait_certificate: true
cert_manager_values:
  crds:
    enabled: true
  # Intégration Gateway API : cert-manager lit l'annotation de la Gateway et
  # crée le Certificat de l'écouteur HTTPS.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
  cainjector:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 160Mi
  webhook:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi
cert_manager_acme_issuers:
  - name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
  - name: letsencrypt-production
    server: https://acme-v02.api.letsencrypt.org/directory
