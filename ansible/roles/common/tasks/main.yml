---
- name: Mettre à jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Appliquer les mises à jour des paquets installés
  ansible.builtin.apt:
    upgrade: safe

- name: Installer les outils de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Définir le fuseau horaire
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Activer et démarrer la synchronisation de l'heure
  ansible.builtin.service:
    name: "{{ common_time_service }}"
    state: started
    enabled: true

- name: Définir le nom d'hôte
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Déclarer les machines du cluster dans /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED : machines du cluster"
    block: "{{ lookup('ansible.builtin.template', 'hosts_block.j2') }}"
    owner: root
    group: root
    mode: "0644"
