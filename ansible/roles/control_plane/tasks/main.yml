---
- name: Chercher un cluster déjà initialisé
  ansible.builtin.stat:
    path: "{{ control_plane_admin_conf }}"
  register: control_plane_admin_stat

- name: Générer la configuration kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ control_plane_config_file }}"
    owner: root
    group: root
    mode: "0600"

# --skip-token-print : la commande d'adhésion (avec jeton) n'est jamais
# affichée ; elle sera régénérée à la demande par le rôle worker.
- name: Initialiser le plan de contrôle (kubeadm init)
  ansible.builtin.command:
    cmd: /usr/bin/kubeadm init --config {{ control_plane_config_file }} --skip-token-print
    creates: "{{ control_plane_admin_conf }}"
  register: control_plane_init
  failed_when: control_plane_init.rc != 0

- name: Créer le dossier .kube de l'utilisateur
  ansible.builtin.file:
    path: "/home/{{ control_plane_user }}/.kube"
    state: directory
    owner: "{{ control_plane_user }}"
    group: "{{ control_plane_user }}"
    mode: "0700"

- name: Configurer kubectl pour l'utilisateur sur le plan de contrôle
  ansible.builtin.copy:
    src: "{{ control_plane_admin_conf }}"
    dest: "/home/{{ control_plane_user }}/.kube/config"
    remote_src: true
    owner: "{{ control_plane_user }}"
    group: "{{ control_plane_user }}"
    mode: "0600"

# Clusters déjà initialisés sans serverTLSBootstrap : on met aussi à jour la
# configuration locale du kubelet et la ConfigMap partagée (futurs nœuds).
- name: Activer serverTLSBootstrap dans la configuration du kubelet
  ansible.builtin.lineinfile:
    path: /var/lib/kubelet/config.yaml
    regexp: '^serverTLSBootstrap:'
    line: "serverTLSBootstrap: true"
    insertafter: '^cgroupDriver:'
  notify: Redémarrer kubelet (plan de contrôle)

- name: Vérifier la ConfigMap kubelet-config du cluster
  ansible.builtin.shell: >-
    set -o pipefail;
    /usr/bin/kubectl --kubeconfig {{ control_plane_admin_conf }} -n kube-system
    get configmap kubelet-config -o jsonpath='{.data.kubelet}' | grep -q '^serverTLSBootstrap: true'
  args:
    executable: /bin/bash
  register: control_plane_kubelet_cm
  changed_when: false  # lecture seule
  failed_when: false  # rc != 0 signifie simplement "à mettre à jour"

- name: Publier la configuration kubelet du cluster (serverTLSBootstrap)
  ansible.builtin.command: >-
    /usr/bin/kubeadm init phase upload-config kubelet --config {{ control_plane_config_file }}
  when: control_plane_kubelet_cm.rc != 0
  changed_when: true  # exécutée seulement si la ConfigMap est à mettre à jour

- name: Appliquer un éventuel redémarrage de kubelet maintenant
  ansible.builtin.meta: flush_handlers

- name: Attendre que l'API Kubernetes soit prête
  ansible.builtin.command: /usr/bin/kubectl --kubeconfig {{ control_plane_admin_conf }} get --raw=/readyz
  register: control_plane_readyz
  until: control_plane_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false  # lecture seule
