---
control_plane_config_file: /etc/kubernetes/kubeadm-config.yaml
control_plane_admin_conf: /etc/kubernetes/admin.conf
control_plane_user: azureuser
control_plane_private_ip: "{{ hostvars[inventory_hostname]['k8s_private_ip'] }}"
control_plane_public_ip: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
control_plane_cert_sans:
  - "{{ control_plane_private_ip }}"
  - "{{ control_plane_public_ip }}"
  - "{{ inventory_hostname }}"
