---
- name: Installer unattended-upgrades
  ansible.builtin.apt:
    name: "{{ hardening_unattended_packages }}"
    state: present

- name: Activer les mises à jour automatiques quotidiennes
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# Pas de redémarrage automatique : ces machines seront des nœuds Kubernetes,
# un reboot doit être décidé (et le nœud drainé) manuellement.
- name: Interdire le redémarrage automatique
  ansible.builtin.template:
    src: 52shoplite-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52shoplite-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
