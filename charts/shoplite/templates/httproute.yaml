# Route unique vers le frontend (les services backend ne sont jamais exposés directement).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shoplite
  labels:
    app.kubernetes.io/name: shoplite
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ required "domain est obligatoire" .Values.domain | quote }}
  rules:
    - backendRefs:
        - name: frontend
          port: {{ .Values.services.frontend.port }}
