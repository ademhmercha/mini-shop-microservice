# Mailpit : serveur de courrier de test, INTERNE uniquement (Service ClusterIP, aucune route ni Ingress).
# Interface web : kubectl -n <ns> port-forward svc/mailpit 8025:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "shoplite-data.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "shoplite-data.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        {{- include "shoplite-data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "shoplite-data.podSecurity" .Values.mailpit | nindent 8 }}
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: MP_MAX_MESSAGES, value: {{ .Values.mailpit.maxMessages | quote }} }
            - { name: MP_DATABASE, value: /data/mailpit.db }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          securityContext:
            {{- include "shoplite-data.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
