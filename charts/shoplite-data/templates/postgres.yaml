apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    {{- include "shoplite-data.labels" . | nindent 4 }}
data:
  # Même script qu'en local (infra/postgres/init.sh) : une base et deux rôles (propriétaire, applicatif) par service.
  10-init.sh: |
{{ .Files.Get "files/init.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "shoplite-data.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "shoplite-data.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "shoplite-data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "shoplite-data.podSecurity" .Values.postgres | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Toutes les clés du Secret (mots de passe des rôles) deviennent des variables, comme en local.
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.existingSecret }}
          securityContext:
            {{- include "shoplite-data.containerSecurity" . | nindent 12 }}
          readinessProbe:
            # En TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket Unix.
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
            periodSeconds: 5
            failureThreshold: 36
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
