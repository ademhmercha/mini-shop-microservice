openapi: 3.0.3
info:
  title: ShopLite - service cart
  version: 1.0.0
  description: >
    Panier stocké dans Redis. Un panier invité est identifié par un cookie HttpOnly (cart_sid) ;
    avec un jeton Bearer valide, le panier est celui du compte. Accessible sous /api/cart (Nginx retire ce préfixe).
servers:
  - url: /api/cart
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      description: Obligatoire (valeur "shoplite") pour modifier un panier invité ; l'en-tête Origin doit correspondre au site.
      schema: { type: string, enum: [shoplite] }
  schemas:
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties: { productId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 20 } }
        itemCount: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string }, requestId: { type: string } }
paths:
  /:
    get:
      summary: Contenu du panier (compte ou invité)
      security: [{}, { bearer: [] }]
      responses:
        '200': { description: Panier, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
    delete:
      summary: Vide le panier
      security: [{}, { bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Panier vidé }
  /items:
    post:
      summary: Ajoute une quantité d'un produit (cumulée, plafonnée à 20 par référence)
      security: [{}, { bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties: { productId: { type: string, format: uuid }, quantity: { type: integer, default: 1 } }
      responses:
        '201': { description: Panier mis à jour, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { description: Entrée invalide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Panier plein }
  /items/{productId}:
    put:
      summary: Fixe la quantité (0 retire la référence)
      security: [{}, { bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 0, maximum: 20 } } }
      responses:
        '200': { description: Panier mis à jour }
    delete:
      summary: Retire une référence
      security: [{}, { bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Panier mis à jour }
  /merge:
    post:
      summary: Fusionne le panier invité (cookie) dans le panier du compte, à la connexion
      security: [{ bearer: [] }]
      responses:
        '200': { description: Panier fusionné }
        '401': { description: Authentification requise }
  /healthz:
    get:
      summary: Le processus est vivant
      responses: { '200': { description: OK } }
  /readyz:
    get:
      summary: Redis est joignable
      responses: { '200': { description: Prêt }, '503': { description: Indisponible } }
  /metrics:
    get:
      summary: Métriques Prometheus
      responses: { '200': { description: Format texte Prometheus } }
