# ShopLite - Maison Argile : lancement local complet.
# Prérequis : `node scripts/gen-keys.mjs` (crée .env et .secrets/, ignorés par Git).
# Seuls le site (http://localhost:8080) et l'interface Mailpit (http://localhost:8025) sont exposés, en local uniquement.

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: info
  # Le site est servi en http sur localhost : le cookie Secure doit être désactivé en local uniquement.
  APP_ORIGIN: http://localhost:8080
  COOKIE_SECURE: "false"
  TRUST_PROXY: "1"

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lancez d'abord node scripts/gen-keys.mjs}
      AUTH_DB_OWNER_PASSWORD: ${AUTH_DB_OWNER_PASSWORD:?}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD:?}
      CATALOG_DB_OWNER_PASSWORD: ${CATALOG_DB_OWNER_PASSWORD:?}
      CATALOG_DB_APP_PASSWORD: ${CATALOG_DB_APP_PASSWORD:?}
      ORDERS_DB_OWNER_PASSWORD: ${ORDERS_DB_OWNER_PASSWORD:?}
      ORDERS_DB_APP_PASSWORD: ${ORDERS_DB_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  # ---- Migrations : jobs ponctuels, exécutés avec l'utilisateur propriétaire du schéma ----
  auth-migrate:
    image: shoplite/auth:local
    build: ./services/auth
    command: ["node", "src/migrate.js"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://auth_owner:${AUTH_DB_OWNER_PASSWORD}@postgres:5432/auth_db
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  catalog-migrate:
    image: shoplite/catalog:local
    build: ./services/catalog
    command: ["node", "src/migrate.js"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://catalog_owner:${CATALOG_DB_OWNER_PASSWORD}@postgres:5432/catalog_db
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  orders-migrate:
    image: shoplite/orders:local
    build: ./services/orders
    command: ["node", "src/migrate.js"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://orders_owner:${ORDERS_DB_OWNER_PASSWORD}@postgres:5432/orders_db
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  # Compte de démonstration (développement uniquement)
  auth-seed:
    image: shoplite/auth:local
    command: ["node", "src/seed.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://auth_app:${AUTH_DB_APP_PASSWORD}@postgres:5432/auth_db
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    networks: [backend]

  # ---- Services ----
  auth:
    <<: *hardened
    image: shoplite/auth:local
    environment:
      <<: *node-env
      PORT: "3001"
      DATABASE_URL: postgres://auth_app:${AUTH_DB_APP_PASSWORD}@postgres:5432/auth_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      JWT_RETIRED_PUBLIC_KEYS_DIR: /run/secrets/retired
      JWT_KEY_ID: ${JWT_KEY_ID:-key-1}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ORDERS_INTERNAL_URL: http://orders:3004
      CART_INTERNAL_URL: http://cart:3003
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    volumes:
      - ./.secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./.secrets/retired:/run/secrets/retired:ro
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    networks: [backend]

  catalog:
    <<: *hardened
    image: shoplite/catalog:local
    environment:
      <<: *node-env
      PORT: "3002"
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_APP_PASSWORD}@postgres:5432/catalog_db
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }
    networks: [backend]

  cart:
    <<: *hardened
    image: shoplite/cart:local
    build: ./services/cart
    environment:
      <<: *node-env
      PORT: "3003"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      AUTH_JWKS_URL: http://auth:3001/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [backend]

  orders:
    <<: *hardened
    image: shoplite/orders:local
    environment:
      <<: *node-env
      PORT: "3004"
      DATABASE_URL: postgres://orders_app:${ORDERS_DB_APP_PASSWORD}@postgres:5432/orders_db
      AUTH_JWKS_URL: http://auth:3001/.well-known/jwks.json
      CART_URL: http://cart:3003
      CATALOG_URL: http://catalog:3002
      UPSTREAM_TIMEOUT_MS: "3000"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    depends_on:
      orders-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      catalog: { condition: service_healthy }
      cart: { condition: service_healthy }
    networks: [backend]

  frontend:
    image: shoplite/frontend:local
    build: ./services/frontend
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_UPSTREAM: auth:3001
      CATALOG_UPSTREAM: catalog:3002
      CART_UPSTREAM: cart:3003
      ORDERS_UPSTREAM: orders:3004
    depends_on:
      auth: { condition: service_healthy }
      catalog: { condition: service_healthy }
      cart: { condition: service_healthy }
      orders: { condition: service_healthy }
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  redisdata:
